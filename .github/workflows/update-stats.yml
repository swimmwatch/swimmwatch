name: Update profile header

on:
  schedule:
    # Daily at 03:17 UTC (06:17 Europe/Moscow).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-header
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test profile renderer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Refresh public repository languages
        uses: readme-tools/github-readme-stats-action@d82657a0e215a28ec48bfc9b3987999a279f93be # v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&locale=en&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate all profile banners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update-profile-stats.py "$PROFILE_OWNER"

      - name: Save regenerated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- profile/banner-*.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Profile banners are already up to date."
            exit 0
          fi
          git commit -m "Refresh profile header statistics"
          git push
